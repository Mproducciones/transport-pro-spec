# Blueprint Render: API Docker + Postgres externo (Neon).
# https://render.com/docs/blueprint-spec
#
# Tras el primer deploy, completá en el dashboard las env vars marcadas sync: false
# y alineá FRONTEND_URL / CORS_ORIGINS con la URL de Vercel.

services:
  - type: web
    name: transport-pro-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CROSS_ORIGIN_COOKIES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
